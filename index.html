<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>AllDownloader — YouTube, Instagram, TikTok, SoundCloud &amp; Spotify</title>
<meta name="description" content="Paste a link, pick a quality, download. Up to 8K video, high-bitrate audio. Works on phones.">
<link rel="stylesheet" href="/assets/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬇️</text></svg>">
</head>
<body>
<header class="top">
  <h1><span aria-hidden="true">⬇</span> AllDownloader</h1>
  <p class="tagline">Paste a link. Pick a quality. Done.</p>
</header>

<main>
  <form id="form" class="search" autocomplete="off">
    <div class="field">
      <input id="url" type="url" inputmode="url" spellcheck="false" required
             placeholder="Paste a link…" aria-label="Media link">
      <button type="button" id="paste" class="ghost" title="Paste from clipboard" aria-label="Paste from clipboard">Paste</button>
    </div>
    <button type="submit" id="go" class="primary">Get downloads</button>
  </form>

  <ul class="platforms" aria-label="Supported platforms">
    <li data-platform="youtube">YouTube <em>up to 8K</em></li>
    <li data-platform="instagram">Instagram</li>
    <li data-platform="tiktok">TikTok <em>no watermark</em></li>
    <li data-platform="soundcloud">SoundCloud</li>
    <li data-platform="spotify">Spotify</li>
  </ul>

  <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  <section id="result" class="result" hidden></section>
</main>

<footer>
  <p>Download only what you have the right to download. Respect each platform's terms and local copyright law.</p>
</footer>

<script src="/assets/app.js" defer></script>
</body>
</html>
